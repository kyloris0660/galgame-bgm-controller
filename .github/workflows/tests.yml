name: Windows tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python build/build.py --kind gui --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: GalBGMController-Windows
          path: |
            dist/GalBGMController/
            dist/GalBGMController-single.exe
